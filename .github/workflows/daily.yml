name: Daily sale check

on:
  schedule:
    # 13:23 UTC = 8:23am CDT (Mar-Nov) / 7:23am CST (Nov-Mar). Minute :23 (not
    # :00) dodges the top-of-hour scheduling stampede, so GitHub dispatches the
    # scheduled run sooner and with less day-to-day variance (delay is still
    # best-effort, not eliminated). Cron only takes UTC, so DST drifts an hour.
    - cron: "23 13 * * *"
  workflow_dispatch:         # allows manual trigger from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest
    # Raised 15 -> 45: the Shopify per-IP rate-limit fix serialises both product
    # fetches and homepage fetches at a 5 s global gap (plus adaptive
    # Retry-After backoff), so a full run now takes ~20-30 min instead of the
    # old few-minute fast path. 45 leaves comfortable headroom for retry storms
    # without masking a genuine hang (an indefinite stall still trips it).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e .

      # Browser-render fallback for Cloudflare-blocked JS-SPA storefronts
      # (issue #1, src/browser_fetch.py): the last recovery rung renders a
      # blocked product page in headless Chromium. The playwright *package*
      # comes with `pip install -e .`; the ~150MB browser binary is cached
      # keyed on the resolved playwright version so most runs restore in
      # seconds. If the render rung ever logs missing-shared-library errors,
      # switch the install line to `playwright install --with-deps chromium`.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pip show playwright | awk '/^Version:/{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        run: playwright install chromium

      - name: Run sale check
        env:
          # This repo is PUBLIC: Actions logs are readable by any logged-in
          # GitHub user for ~90 days, and httpx logs every request URL at
          # INFO — without this flag each run republishes the entire private
          # watchlist. src/log_privacy.py rewrites URLs in every log record
          # (incl. tracebacks) to scheme://host and masks promo-code values.
          # Never set this locally: full URLs at INFO are the local
          # debugging contract.
          SALE_CHECK_REDACT_LOGS: "1"
          WATCHLIST_URL: ${{ secrets.WATCHLIST_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
          # GitHub Actions auto-provides a GITHUB_TOKEN with REPO scope only —
          # no gist scope. We override it with a personal-access-token stored
          # under the secret name GIST_TOKEN so state.py can PATCH the Gist.
          GITHUB_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Optional: user's preferred sizes for size-aware OOS detection in
          # extract.parse. Empty/unset preserves existing page-level OOS
          # behaviour. PREFERRED_SIZES_PANTS overrides PREFERRED_SIZES for
          # URLs detected as bottoms (pants/jeans/joggers/shorts/etc.).
          # See CLAUDE.md → Secrets for details.
          PREFERRED_SIZES: ${{ secrets.PREFERRED_SIZES }}
          PREFERRED_SIZES_PANTS: ${{ secrets.PREFERRED_SIZES_PANTS }}
          # Fit-feedback web form (Apps Script). Both sign the per-item links in
          # the daily digest section + Friday weekly email. With either blank the
          # feature stays dormant, so they MUST be mapped in here — a repo secret
          # alone does nothing unless the workflow injects it. See CLAUDE.md.
          FIT_FORM_BASE_URL: ${{ secrets.FIT_FORM_BASE_URL }}
          FIT_LINK_SECRET: ${{ secrets.FIT_LINK_SECRET }}
          # BodySpec login for the ~weekly DEXA scan-cache refresh (body_scans.json),
          # which the fit-feedback web form reads to match a body state to a review
          # the moment it's left. Age-gated + failure-isolated in main: blank creds =
          # dormant (the cron behaves exactly as before). BODY_SCAN_MAX_AGE_DAYS
          # (optional, default 7) tunes how stale the cache may get before a refresh.
          BODYSPEC_USERNAME: ${{ secrets.BODYSPEC_USERNAME }}
          BODYSPEC_PASSWORD: ${{ secrets.BODYSPEC_PASSWORD }}
          BODY_SCAN_MAX_AGE_DAYS: ${{ secrets.BODY_SCAN_MAX_AGE_DAYS }}
          # Shops kept out of the wardrobe (privacy). The daily cron doesn't scan
          # orders, but it reads the wardrobe for the fit/removal nudges — this
          # filters excluded shops out of those sections (main._wardrobe_items).
          # The weekly order-scan workflow is where ingestion/hard-delete happen.
          EXCLUDED_SHOPS: ${{ secrets.EXCLUDED_SHOPS }}
          # Cost lever #5 (issue #16): shadow A/B run. The daily fuzzy call is
          # ALSO sent to this model and the verdict diff logged to
          # shadow_runs.json — the digest is never affected. Costs ~$0.06/run
          # extra at Haiku input prices. After ~a week, review with
          # `python -m src.shadow_report`; then either swap DEFAULT_MODEL in
          # src/claude_fuzzy.py or just DELETE this line to end the experiment.
          SHADOW_MODEL: claude-haiku-4-5-20251001
        run: python -m src.main
