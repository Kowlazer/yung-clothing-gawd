[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sale-check"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "extruct>=0.17",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.28",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "questionary>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-httpx>=0.30",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
